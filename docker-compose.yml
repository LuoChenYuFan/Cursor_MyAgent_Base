services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PROJECT_ROOT: /app
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      EMAIL_RECEIPTS_PATH: /app/data/.email_receipts.json
    volumes:
      - ./contacts.json:/app/contacts.json:ro
      - email_receipts:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  email_receipts:
